name: Enterprise source build (no push)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend-build:
    name: Backend Dockerfile (push false)
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build backend image without pushing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: local/smc-copilot-skyvern-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/smc-copilot/skyvern
            org.opencontainers.image.revision=${{ github.sha }}
  ui-build:
    name: UI Dockerfile (push false)
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build UI image without pushing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.ui
          push: false
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: local/smc-copilot-skyvern-ui:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/smc-copilot/skyvern
            org.opencontainers.image.revision=${{ github.sha }}
